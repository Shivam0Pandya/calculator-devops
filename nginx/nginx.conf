# Round-robin load balancing across the two calculator replicas.
upstream calculator_backend {
    server calculator-1:8080;
    server calculator-2:8080;
}

server {
    listen 80;

    # Lets you see which replica served a request: curl -i ...
    add_header X-Upstream $upstream_addr always;

    location / {
        proxy_pass http://calculator_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
